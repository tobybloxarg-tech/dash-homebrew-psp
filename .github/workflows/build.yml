name: Build PSP homebrew

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el proyecto
        uses: actions/checkout@v4

      - name: Instalar SDK de PSP
        run: |
          curl -L --fail https://github.com/pspdev/pspdev/releases/latest/download/pspdev-ubuntu-latest-x86_64.tar.gz -o /tmp/pspdev.tar.gz
          tar -xzf /tmp/pspdev.tar.gz -C "$HOME"
          echo "\(HOME/pspdev/bin" >> "\)GITHUB_PATH"
          echo "PSPDEV=\(HOME/pspdev" >> "\)GITHUB_ENV"

      - name: Compilar
        run: |
          mkdir -p build
          cd build
          psp-cmake ..
          make -j2

      - name: Preparar descarga
        run: |
          mkdir -p output/PSP/GAME/DashHomebrew
          EBOOT="$(find build -name EBOOT.PBP -type f -print -quit)"
          test -n "$EBOOT"
          cp "$EBOOT" output/PSP/GAME/DashHomebrew/EBOOT.PBP

      - name: Publicar EBOOT
        uses: actions/upload-artifact@v4
        with:
          name: DashHomebrew-EBOOT
          path: output/PSP/GAME/DashHomebrew/EBOOT.PBP
          
